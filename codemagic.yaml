workflows:
  ios-native-demo:
    name: iOS Native Demo
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AgeWallet ASC API Key
    environment:
      xcode: latest
    scripts:
      - name: Register test devices
        script: |
          app-store-connect devices register "Ash's iPhone" "00008150-001A0DE826B8401C"
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "io.agewallet.sdk.demo.ios" \
            --type IOS_APP_AD_HOC \
            --create \
            --verbose
          keychain initialize
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --save \
            --verbose
          keychain add-certificates
      - name: Apply code signing to Xcode project
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project example/AgeWalletDemo/AgeWalletDemo.xcodeproj \
            --scheme AgeWalletDemo
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
